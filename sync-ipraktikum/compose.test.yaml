# Isolated integration-test databases; never uses the application's development volumes.
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["127.0.0.1:17687:7687"]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:17017:27017"]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
