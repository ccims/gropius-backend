graphql:
  packages:
    - "gropius"
spring:
  mongodb:
    # Connection properties moved out of spring.data.mongodb in Spring Boot 4.
    "authentication-database": admin
  data:
    mongodb:
      "auto-index-creation": true
management:
  endpoints:
    web:
      base-path: /
logging:
  level:
    org.springframework.data.neo4j: ERROR
    io.github.graphglue: ERROR
    gropius.sync: TRACE
